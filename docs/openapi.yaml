openapi: 3.0.3
info:
  title: API de Solicitações de Atendimento
  description: >
    API REST para registrar e acompanhar solicitações de atendimento
    encaminhadas a unidades públicas de saúde. Todos os dados são fictícios.
  version: 1.0.0

servers:
  - url: http://localhost:8000/api/v1
    description: Ambiente local (Docker Compose)

tags:
  - name: Solicitações

paths:
  /solicitacoes:
    get:
      tags: [Solicitações]
      summary: Lista solicitações com paginação e filtros
      parameters:
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/Status' }
        - name: categoria
          in: query
          schema: { $ref: '#/components/schemas/Categoria' }
        - name: prioridade
          in: query
          schema: { $ref: '#/components/schemas/Prioridade' }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: per_page
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 15 }
      responses:
        '200':
          description: Lista paginada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SolicitacaoPaginada' }
        '422':
          $ref: '#/components/responses/ErroValidacao'

    post:
      tags: [Solicitações]
      summary: Cria uma solicitação
      description: A solicitação é criada com status RECEBIDA e protocolo gerado pela aplicação.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SolicitacaoCreate' }
      responses:
        '201':
          description: Criada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SolicitacaoEnvelope' }
        '422':
          $ref: '#/components/responses/ErroValidacao'

  /solicitacoes/{id}:
    get:
      tags: [Solicitações]
      summary: Detalhe de uma solicitação
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Encontrada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SolicitacaoEnvelope' }
        '404':
          $ref: '#/components/responses/NaoEncontrado'

  /solicitacoes/{id}/status:
    patch:
      tags: [Solicitações]
      summary: Atualiza o status respeitando as transições permitidas
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { $ref: '#/components/schemas/Status' }
      responses:
        '200':
          description: Status atualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SolicitacaoEnvelope' }
        '404':
          $ref: '#/components/responses/NaoEncontrado'
        '422':
          description: Transição de status não permitida
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Erro' }
              example:
                message: "Não é possível alterar o status de CONCLUIDA para EM_ANALISE."
                errors:
                  status: ["Transição de status não permitida."]

components:
  schemas:
    Categoria:
      type: string
      enum: [CONSULTA, EXAME, VACINACAO, OUTRO]

    Prioridade:
      type: string
      enum: [BAIXA, MEDIA, ALTA, URGENTE]

    Status:
      type: string
      enum: [RECEBIDA, EM_ANALISE, AGENDADA, CONCLUIDA, CANCELADA]

    Solicitacao:
      type: object
      properties:
        id: { type: integer, example: 1 }
        protocolo: { type: string, example: "2026-000123" }
        nome_solicitante: { type: string, example: "Maria Fictícia da Silva" }
        categoria: { $ref: '#/components/schemas/Categoria' }
        prioridade: { $ref: '#/components/schemas/Prioridade' }
        status: { $ref: '#/components/schemas/Status' }
        descricao: { type: string, example: "Solicitação de consulta de rotina." }
        justificativa_prioridade:
          type: string
          nullable: true
          example: null
        data_criacao: { type: string, format: date-time }
        data_atualizacao: { type: string, format: date-time }

    SolicitacaoCreate:
      type: object
      required: [nome_solicitante, categoria, prioridade, descricao]
      properties:
        nome_solicitante: { type: string, maxLength: 150 }
        categoria: { $ref: '#/components/schemas/Categoria' }
        prioridade: { $ref: '#/components/schemas/Prioridade' }
        descricao: { type: string, maxLength: 1000 }
        justificativa_prioridade:
          type: string
          nullable: true
          description: Obrigatória quando prioridade for URGENTE.

    SolicitacaoEnvelope:
      type: object
      properties:
        data: { $ref: '#/components/schemas/Solicitacao' }

    SolicitacaoPaginada:
      type: object
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Solicitacao' }
        meta:
          type: object
          properties:
            current_page: { type: integer }
            per_page: { type: integer }
            total: { type: integer }
            last_page: { type: integer }

    Erro:
      type: object
      properties:
        message: { type: string }
        errors:
          type: object
          additionalProperties:
            type: array
            items: { type: string }

  responses:
    ErroValidacao:
      description: Dados inválidos
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Erro' }
          example:
            message: "Os dados fornecidos são inválidos."
            errors:
              justificativa_prioridade:
                ["A justificativa é obrigatória quando a prioridade for URGENTE."]

    NaoEncontrado:
      description: Solicitação não encontrada
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Erro' }
          example:
            message: "Solicitação não encontrada."
