services:
  db:
    image: postgres:16-alpine
    container_name: vlab_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-solicitacoes}
      POSTGRES_USER: ${DB_USERNAME:-vlab}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-vlab_dev}
    ports:
      - "${DB_PORT_HOST:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-vlab} -d ${DB_DATABASE:-solicitacoes}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    container_name: vlab_api
    restart: unless-stopped
    working_dir: /var/www/html
    environment:
      APP_ENV: ${APP_ENV:-local}
      APP_DEBUG: ${APP_DEBUG:-true}
      APP_URL: http://localhost:${API_PORT:-8000}
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-solicitacoes}
      DB_USERNAME: ${DB_USERNAME:-vlab}
      DB_PASSWORD: ${DB_PASSWORD:-vlab_dev}
    volumes:
      - ./api:/var/www/html
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "php artisan migrate --force &&
             php artisan db:seed --force &&
             php artisan serve --host=0.0.0.0 --port=8000"

  web:
    build:
      context: .
      dockerfile: docker/web/Dockerfile
    container_name: vlab_web
    restart: unless-stopped
    working_dir: /app
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000/api/v1}
    volumes:
      - ./web:/app
      - web_node_modules:/app/node_modules
    ports:
      - "${WEB_PORT:-5173}:5173"
    depends_on:
      - api
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"

volumes:
  db_data:
  web_node_modules:
